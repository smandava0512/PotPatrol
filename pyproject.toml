[project]
name = "roadwatch-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "alembic>=1.15,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roadwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
