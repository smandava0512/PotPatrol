name: Pot Patrol iOS (Developer 1)

on:
  push:
    branches: [codex/developer-1-pot-patrol-ios]
    paths: ["ios/**", ".github/workflows/ios-package.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-package.yml"]

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift tests including MP4 round trip
        run: swift test
      - name: Build hazard view
        run: swift build --product PotPatrolUI
      - name: Compile package for iPhone Simulator
        run: xcrun swift build --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
